networks:
  ai-net:
    external: true

volumes:
  caddy_data:
  postgres_data:
  ollama_data:
  qdrant_data:
  redis_data:

services:
  caddy:
    image: caddy:2.8-alpine
    container_name: caddy
    restart: unless-stopped
    networks: [ai-net]
    ports:
      - "80:80"
    volumes:
      - ../config/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    restart: unless-stopped
    networks: [ai-net]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://spark:spark@postgres:5432/litellm
    volumes:
      - ../config/litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:4000:4000"

  vllm:
    image: vllm/vllm-openai:cu130-nightly
    container_name: vllm
    restart: unless-stopped
    networks: [ai-net]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /data/models:/models:ro
    command: >
      --model /models/nvidia-nemotron-3-super-120b-a12b-nvfp4
      --served-model-name expert
      --quantization nvfp4
      --max-model-len 65536
      --gpu-memory-utilization 0.72
      --max-num-seqs 4
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    networks: [ai-net]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: unless-stopped
    networks: [ai-net]
    environment:
      POSTGRES_USER: spark
      POSTGRES_PASSWORD: spark
      POSTGRES_DB: spark
    volumes:
      - postgres_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - ../config/searxng:/etc/searxng:rw
    ports:
      - "127.0.0.1:8080:8080"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    networks: [ai-net]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
