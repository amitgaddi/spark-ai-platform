model_list:
  - model_name: expert
    litellm_params:
      model: openai/expert
      api_base: http://vllm:8000/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 600
      max_tokens: 32000

  - model_name: coder
    litellm_params:
      model: ollama/qwen3-coder:30b
      api_base: http://ollama:11434
      timeout: 600
      max_tokens: 32000

  - model_name: fast
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      timeout: 180
      max_tokens: 32000

  # --- CLAUDE CODE MAPPINGS ---
  - model_name: "claude-3-5-sonnet-20241022"
    litellm_params:
      model: openai/expert
      api_base: http://vllm:8000/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 600
      max_tokens: 32000

  - model_name: "claude-3-5-haiku-20241022"
    litellm_params:
      model: ollama/qwen3:8b
      api_base: http://ollama:11434
      timeout: 180
      max_tokens: 32000

  - model_name: "claude-opus-5"
    litellm_params:
      model: openai/expert
      api_base: http://vllm:8000/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 600
      max_tokens: 32000

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  timeout: 600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
